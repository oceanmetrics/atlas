name: Pages

# Checks run on every push (any branch) and every pull request, then every instance is built by the ONE
# reusable workflow (build-instance.yml, the same one MarineSensitivity/atlas calls at a pinned tag);
# only a push to `main` goes on to publish the oceanmetrics `dist/` -- the SAME artifact that build
# job made, never a second `vite build` -- to this repository's `gh-pages` branch (branch-based
# Pages: Settings -> Pages -> "Deploy from a branch" -> gh-pages), served at
# https://oceanmetrics.io/atlas/.
on:
  push:
    # the feedback Apps Script (scripts/feedback/Code.gs) commits each report's screenshot to
    # main under feedback/<id>.png; that commit changes nothing the build reads, and as a plain
    # push it re-ran every job AND (via the per-ref concurrency group below) cancelled the
    # in-flight jobs of the real push before it.
    paths-ignore:
      - "feedback/**"
      - "pipeline/**"
  pull_request:
  workflow_dispatch:

# scoped per ref, not a single global "pages" group: a global group would let any push to a
# feature branch or PR cancel an in-flight run FROM MAIN, including one that's mid-publish. Each
# ref still serializes/cancels its own stale runs (so two quick pushes to main can't race to
# publish out of order).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# least privilege by default; the build matrix (for its oceanmetrics deploy) is the only place this is
# escalated.
permissions:
  contents: read

jobs:
  checks:
    name: checks (types, svelte-check, unit tests for every instance, lint, format)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # `npm run check` (svelte-check) sees inside a `.svelte` <script> block the way a plain
      # `tsc --noEmit` above cannot. Separate step so a red svelte-check names itself in the log.
      - run: npm run check

      - run: npx vitest run

      # lint/format are both read-only (no `--fix`/`--write`), so they are safe this early in the job.
      - run: npm run lint

      - run: npm run format:check

      # the size-budget checker's own red fixtures: they prove size-budget.mjs can actually go RED
      # against a real Vite manifest, not only a unit test's synthetic one, so a manifest-shape drift
      # that made the checker walk nothing would be caught here even if every vitest case stayed
      # green. `!` inverts the exit code: each of these STEPS fails if its fixture ever stops being
      # red. (The instance builds themselves, their budgets and the dist checks run in `build`.)
      - run: npm run build:fixture:size-budget && ! node scripts/size-budget.mjs --dist tests/fixtures/size-budget-static-duckdb/dist

      - run: npm run build:fixture:size-budget-worker && ! node scripts/size-budget.mjs --dist tests/fixtures/size-budget-worker/dist

  # every instance (instances/<id>/) built by the ONE reusable workflow MarineSensitivity/atlas calls
  # too (build-instance.yml): the build, its instance's size budget, the dist checks and the
  # instance module check. oceanmetrics is published from `main` (deploy: the SAME artifact this job
  # built, to this repository's gh-pages, served at https://oceanmetrics.io/atlas/);
  # marinesensitivity is built and checked only: https://marinesensitivity.org/atlas/ is published by
  # MarineSensitivity/atlas at its own pin (docs/mst-thin-repo.md). Unit tests run once, for every
  # instance, in `checks` (vitest.config.ts has one project per instance), so the builds skip them.
  build:
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        instance: [oceanmetrics, marinesensitivity]
    permissions:
      contents: write # the oceanmetrics leg deploys from main; the called workflow escalates only its deploy job
    uses: ./.github/workflows/build-instance.yml
    with:
      instance: ${{ matrix.instance }}
      unit-tests: false
      deploy: ${{ matrix.instance == 'oceanmetrics' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Build-time configuration, all optional and all repository VARIABLES (Settings -> Secrets and
      # variables -> Actions -> Variables), never secrets: the endpoint URLs ship in the public bundle
      # either way. They are this repository's (OceanMetrics Atlas): the marinesensitivity leg gets
      # none of them, and the seal on (its production build carries it, as the thin repo's does).
      #   VITE_FEEDBACK_URL  the Apps Script `/exec` URL for "Send feedback" (src/lib/feedback/endpoint.ts)
      #   VITE_LOG_URL       the Sheet-log beacon URL (src/lib/analytics/logUrl.ts)
      #   VITE_GA_ID         the GA4 measurement id (src/lib/analytics/gaId.ts); no id ships in the repo
      #   VITE_CATALOG_BASE  override of the catalog origin (src/lib/catalog/base.ts)
      VITE_FEEDBACK_URL: ${{ matrix.instance == 'oceanmetrics' && vars.VITE_FEEDBACK_URL || '' }}
      VITE_LOG_URL: ${{ matrix.instance == 'oceanmetrics' && vars.VITE_LOG_URL || '' }}
      VITE_GA_ID: ${{ matrix.instance == 'oceanmetrics' && vars.VITE_GA_ID || '' }}
      VITE_CATALOG_BASE: ${{ matrix.instance == 'oceanmetrics' && vars.VITE_CATALOG_BASE || '' }}
      VITE_SEAL: ${{ matrix.instance == 'marinesensitivity' && '1' || '' }}

  test-faults:
    name: test:faults (seeded-fault suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # scripts/test-faults.mjs applies each tests/faults/*.patch in its own `git worktree add
      # --detach` copy of HEAD under $TMPDIR, runs the named gate, and expects RED -- a fault that
      # stays green fails this job. Independent of the `checks` job above (it never touches dist/).
      - run: npm run test:faults
        env:
          TMPDIR: ${{ runner.temp }}

  e2e-engine:
    name: e2e (DuckDB-WASM engine, eh/mvp x chromium/firefox/webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright
        with:
          browsers: chromium firefox webkit

      # docs/engine.md's own invocation: the mirror has to exist before this harness's specs run,
      # the same way it has to exist before the real app's first read_parquet().
      - run: npm run duckdb:fetch-ext && npm run e2e:engine

  e2e-obis:
    name: e2e (OBIS layer, hermetic over the fixture release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright
        with:
          browsers: chromium

      # e2e/obis.spec.ts: 12 tests over tests/fixtures/obis_h3/ (the storage host routed onto it); the config's
      # webServer builds and previews the app. 15.7 s locally, build included.
      - run: npx playwright test --project=chromium e2e/obis.spec.ts

  e2e-opfs:
    name: e2e (OPFS store tier, fallback matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright
        with:
          browsers: chromium firefox webkit

      - run: npm run duckdb:fetch-ext && npm run e2e:opfs

  analytics-privacy:
    name: e2e (analytics privacy -- GA4 Enhanced Measurement history-event leak)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # this spec's own webServer already runs `build:fixture:analytics-privacy` before `vite
      # preview`; an explicit step keeps a build failure from being mistaken for the e2e run itself.
      - run: npm run build:fixture:analytics-privacy

      - uses: ./.github/actions/playwright
        with:
          browsers: chromium

      - run: npm run e2e:analytics-privacy

      # the oceanmetrics instance's GA4 is the Ocean Metrics bar's (`<om-nav data-ga>`): two real builds of the
      # instance, without VITE_GA_ID and with the dummy G-TEST000000 (e2e/fixtures/nav-analytics/)
      - run: npm run e2e:nav-analytics
