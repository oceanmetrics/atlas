<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OceanMetrics Atlas</title>
    <meta
      name="description"
      content="OceanMetrics Atlas: a catalog of species distribution model products with explicit credits, plus places, for U.S. marine areas. Supported by MMA and MBON."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- link previews: og:image must be absolute (crawlers do not resolve it against the page); the
         atlas is published at https://oceanmetrics.io/atlas/ (pages.yml). public/og.png is rendered
         from public/og.svg by scripts/render-og.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OceanMetrics Atlas" />
    <meta property="og:title" content="OceanMetrics Atlas" />
    <meta
      property="og:description"
      content="A catalog of species distribution model products with explicit credits, built on STAC. Supported by MMA and MBON."
    />
    <meta property="og:url" content="https://oceanmetrics.io/atlas/" />
    <meta property="og:image" content="https://oceanmetrics.io/atlas/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OceanMetrics Atlas: a hexagon holding a wave, beside the name."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      critical CSS, inlined so the shell paints before any JavaScript bundle loads or parses (plan
      atlas-0 Deliverable 2, carried into atlas-3 step 3). `@import` pulls in src/shell/shell.css
      (which itself imports src/lib/brand/tokens.css) -- Vite's html-inline-proxy resolves BOTH
      imports and inlines the resolved CSS text directly into this tag, in dev and in build alike
      (see vite.config.ts's comment on the html/css pipeline). That is the "build step that copies
      [token values] from tokens.css" the review checklist asks for: nobody types a token value by
      hand here, the bundler copies it -- tests/check-inlined-tokens.test.ts proves the copy is
      faithful, and it is proven able to fail with a seeded, mutated fixture.

      shell.css is the SAME file src/shell/Shell.svelte imports for the hydrated app's own layout,
      so the skeleton below and the real shell read identical geometry -- no second, hand-typed
      copy of any size/spacing value to drift between them (the CLS gate,
      e2e/shell.cls.spec.ts, is what actually proves it, at both viewports and both themes).
    -->
    <style>
      @import "./src/shell/shell.css";
    </style>

    <script>
      window.__t0 = performance.now();
    </script>

    <!--
      pre-paint theme script (spec.md §3): sets `data-theme` on <html> before first paint, through
      the SAME rule as src/lib/state/types.ts's `resolveTheme` (dark -> navy, light -> paper,
      explicit "auto" -> prefers-color-scheme, falling back to navy when that signal is
      unavailable). U2a (round 2): the DEFAULT changed from "auto" to "dark" (DEFAULT_SEL.theme,
      types.ts) -- an absent or malformed `?theme=` now resolves straight to navy, the same as an
      explicit `?theme=dark`, regardless of the OS's prefers-color-scheme; ONLY an explicit
      `?theme=auto` (or its `navy`/`paper` alias -- there is none, "auto" has no resolved-theme
      alias) still asks `matchMedia`. It reads ONLY `location.search` and `matchMedia` and writes
      ONLY `document.documentElement.dataset.theme` -- no localStorage, no fetch, nothing else --
      so there is no flash of the wrong theme and no other side effect.
      tests/shell/theme-preboot.test.ts runs this exact script (extracted from this file) through the
      same case table `resolveTheme` is tested against, and asserts the two never disagree; it
      also asserts the script touches nothing but that one dataset key.
    -->
    <script>
      (function () {
        var theme;
        var q = new URLSearchParams(location.search).get("theme");
        // atlas-8 fix: the gallery/mockups use navy/paper (their own resolved-theme names,
        // docs/design/mockups/*.html) where the real app uses dark/light -- accepting both here
        // means a link copied from a mockup still resolves instead of silently falling through
        // to the default.
        if (q === "navy") q = "dark";
        else if (q === "paper") q = "light";
        if (q === "dark") theme = "navy";
        else if (q === "light") theme = "paper";
        else if (q === "auto") {
          var prefersDark = null;
          try {
            prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            prefersDark = null;
          }
          theme = prefersDark === false ? "paper" : "navy";
        } else {
          // U2a: no key, or garbage -- DEFAULT_SEL.theme is "dark", so this is navy outright,
          // never a prefers-color-scheme lookup.
          theme = "navy";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!--
      fix list #14 (atlas-3 handover item (b), still open until now): the only fallback for
      "JavaScript is on and the bundle 404'd or failed to parse" used to be a <noscript> -- which
      by definition never runs when script IS enabled and just broken. With every asset blocked,
      the page sat there forever: a title, an h1, two dead skip links and ten aria-hidden skeleton
      parts, announcing and showing nothing.

      `src/main.ts` sets `data-hydrated` on <html> as the very last thing it does, right after
      `mount(Shell, ...)` returns -- never inside a try/catch that could swallow a real crash and
      still set it. If that attribute is still absent 8s after this script starts (main.ts 404'd,
      or threw before reaching that line), this reveals a plain, VISIBLE message. `role="alert"`
      (assertive), not `status` (polite) -- the shared Announcer region is for events a user's own
      action caused; this fires with no action at all and needs to interrupt, the way an error
      should.
    -->
    <script>
      (function () {
        window.setTimeout(function () {
          if (document.documentElement.hasAttribute("data-hydrated")) return;
          var el = document.createElement("p");
          el.id = "bundle-load-failed";
          el.setAttribute("role", "alert");
          el.style.cssText =
            "position:fixed;top:var(--space-4);left:var(--space-4);right:var(--space-4);" +
            "z-index:999;margin:0;padding:var(--space-3) var(--space-4);" +
            "border:1px solid var(--border-control);border-radius:var(--radius-card);" +
            "background:var(--surface-raised);color:var(--text-primary);" +
            "font:inherit;box-shadow:var(--elev-3);";
          el.textContent =
            "This page could not load its application code. Reload, or try again later.";
          document.body.insertBefore(el, document.body.firstChild);
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <!-- atlas-8 fix: a single skip link to #panel-region jumped straight past the topbar AND the
         tool rail -- #rail-region's one roving-tabindex stop sits immediately before #panel-region
         in DOM order, so Tab from the skip link landed inside the panel, and the rail was reachable
         only by Shift+Tab backward from there. Two skip links, in DOM/visual/tab order, fixes it:
         each is a real, separately-focusable stop (never display:none), consistent with WCAG's
         "multiple ways to skip repeated content" pattern. -->
    <a class="skip-link" href="#rail-region">Skip to the tools</a>
    <a class="skip-link" href="#panel-region">Skip to the details panel</a>

    <div id="shell" class="app">
      <header class="topbar" data-tour="topbar">
        <span data-tour="brand" style="display: flex; align-items: center; gap: var(--space-2)">
          <h1 class="brand-title" id="app-title">
            <span class="wm-ocean">Ocean</span><span class="wm-metrics">Metrics</span>
            <span class="wm-atlas">Atlas</span>
          </h1>
        </span>

        <div
          class="sk-seg"
          role="group"
          aria-label="Lens"
          data-tour="lens-switch"
          data-control="lens-switch"
          aria-hidden="true"
        >
          <span class="is-pressed">Collections</span>
          <span>Species</span>
        </div>

        <div
          class="search-field topbar-desktop-only"
          data-tour="search"
          data-control="search"
          aria-hidden="true"
        >
          <span class="sk-icon-16"></span>
          <span>Search species and places</span>
        </div>

        <span class="spacer"></span>

        <!--
          flat siblings of .topbar, exactly matching src/shell/Shell.svelte's Share/Help buttons
          (no wrapping element -- an extra wrapper here would change how .topbar's own `gap` is
          distributed and shift everything after it; e2e/shell.cls.spec.ts's geometry-equality gate
          caught exactly that). Each icon placeholder is 18x18, the exact size Shell.svelte passes
          to <Icon size={18}/> for these (--icon class is 20px, sized for the search field's icon
          instead). Icon-only, no trailing label text (owner review item 5, live 0.10.62 -- the
          hydrated buttons dropped their visible words for a hover tooltip, shell.css's
          `.tool[data-tooltip]`). The desktop Report button (`report-top`) that used to sit between
          Share and Help is REMOVED here too (owner review item 3) -- the skeleton and the hydrated
          shell must agree on every `data-control`/`data-tour` anchor
          (tests/shell/shell-invariants.test.ts).
        -->
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="share"
          data-control="share"
          ><span class="sk-icon-tool"></span
        ></span>
        <!-- R3-W2: Download -- same skeleton convention as Share/Help just above; the hydrated
             control lives in DownloadMenu.svelte (Shell.svelte's own mount line carries the
             matching literal `data-tour="download"`/`data-control="download"`, per
             tests/shell/shell-invariants.test.ts's round-trip check). -->
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="download"
          data-control="download"
          ><span class="sk-icon-tool"></span
        ></span>
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="help"
          data-control="help"
          ><span class="sk-icon-tool"></span
        ></span>

        <!--
          P5 (Opus eyes-on assessment, 2026-09-24): the phone-only search button (Shell.svelte,
          right before its <TopBarActions> mount line) -- same skeleton convention as the ⋯
          trigger below (`tool topbar-phone-only`, an 18x18 `sk-icon-tool` placeholder).
        -->
        <span
          class="tool topbar-phone-only"
          aria-hidden="true"
          data-tour="search-phone"
          data-control="search-phone"
          ><span class="sk-icon-tool"></span
        ></span>

        <!--
          R2: About/Feedback moved off the map into the top bar (TopBarActions.svelte) -- plain
          `.tool` spans, same convention as the four above (a dedicated skeleton class here once
          gave one its OWN `display`, which -- tied in specificity -- landed LATER than
          `.topbar-desktop-only`'s hide rule in source order and stayed visible at phone width;
          see shell.css's header comment on the fix). The ⋯ overflow trigger is phone-only
          (`.tool.topbar-phone-only`, shell.css).
        -->
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="feedback"
          data-control="feedback"
          ><span class="sk-icon-tool"></span
        ></span>
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="about"
          data-control="about"
          ><span class="sk-icon-tool"></span
        ></span>
        <span
          class="tool topbar-phone-only"
          aria-hidden="true"
          data-tour="more"
          data-control="more-menu"
          ><span class="sk-icon-tool"></span
        ></span>
        <!--
          P5 fix round 2 (coordinator finding, 390px eyes-on evidence): `topbar-desktop-only`
          added here -- the standalone theme button stopped fitting the phone topbar once the P1
          search button (above) landed beside ⋯; it now also lives in the ⋯ menu
          (TopBarActions.svelte), same route as Feedback/About just above.
        -->
        <span
          class="tool topbar-desktop-only"
          aria-hidden="true"
          data-tour="theme"
          data-control="theme"
          ><span class="sk-icon-tool"></span
        ></span>
      </header>

      <main class="stage" id="stage">
        <div
          id="map"
          class="map"
          role="img"
          aria-label="Map of marine data layers"
          aria-describedby="map-table-equivalent"
          data-tour="map"
        ></div>
        <p id="map-table-equivalent" class="visually-hidden">
          The values shown on the map are also available as text under the Table and Details tools.
        </p>

        <nav
          class="rail-region"
          id="rail-region"
          aria-label="Tools"
          tabindex="-1"
          data-tour="rail"
          data-control="rail"
        >
          <!-- R4-B: the spine has FOUR entries (Layers, Details, Table, Places) and is attached to the
               panel's outer edge -- on the LEFT by default (shell.css `.rail-region`/`.panel-region`
               read `--rail-offset`); the skeleton mirrors both. -->
          <div class="sk-rail" aria-hidden="true">
            <span class="sk-railitem is-pressed"></span>
            <span class="sk-railitem"></span>
            <span class="sk-railitem"></span>
            <span class="sk-railitem"></span>
          </div>
        </nav>

        <div
          class="panel-region"
          id="panel-region"
          tabindex="-1"
          data-tour="panel"
          data-control="panel"
        >
          <div class="sk-panel" aria-hidden="true">
            <div class="sk-panel-grab"></div>
            <div class="sk-panel-head">
              <p class="sk-panel-title">Layers</p>
              <div class="sk-panel-controls">
                <!-- R4-B: Panel's own 2 (move to the other side, collapse), desktop only --
                     `.sk-panel-ctrl` is `display:none` below 900px (shell.css) since Panel itself
                     never renders there (Sheet does, below). -->
                <span class="sk-panel-ctrl"></span>
                <span class="sk-panel-ctrl"></span>
                <!-- Sheet's own 3 (collapse/half/full, unchanged by R1), phone only -- the mirror
                     image of the rule above (shell.css). -->
                <span class="sk-sheet-ctrl"></span>
                <span class="sk-sheet-ctrl"></span>
                <span class="sk-sheet-ctrl"></span>
              </div>
            </div>
            <div class="sk-panel-body">
              <!-- kept for tests/shell/tools.test.ts (index.html must still contain
                   TOOL_BODY.layers verbatim) -- no longer what the hydrated shell shows by
                   default (atlas-4's Layers panel), so it carries no layout weight of its own;
                   the sk-field/sk-switch-row/sk-layers-control placeholders below are what
                   e2e/shell.cls.spec.ts's geometry-equality gate actually matches against the real
                   LayersPanel (measured at 1280px with no boot.json: 4 fields 66px, one switch row
                   24px, the layers-control section 43px, 12px gaps --
                   src/lib/ui/LayersPanel.svelte). The legend (once a `sk-legend-note`
                   placeholder here, for the "not published yet" note) moved OUT of this panel
                   entirely in the atlas-4/5 defect fix -- it is the shell's own floating region
                   over the map now (the lens legends), which the skeleton does not model at all
                   (same as the species lens' pre-existing floating legend never has been). -->
              <span hidden>Layers and options arrive in a later phase.</span>
              <div class="sk-field"></div>
              <div class="sk-field"></div>
              <div class="sk-field"></div>
              <div class="sk-field"></div>
              <div class="sk-switch-row"></div>
              <div class="sk-layers-control"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <noscript>
      This app needs JavaScript to render the map and species. Please enable it.
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
