<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OceanMetrics Atlas">
  <!-- the OceanMetrics mark: a pointy-top hexagon (the atlas' grid cell) holding a wave. Literal colours
       (a favicon is outside the app's data-theme cascade): navy #05294d, teal #2fc7b8, sand #e9dcb4.
       The ring alone answers prefers-color-scheme so the navy hexagon separates from a dark tab strip. -->
  <title>OceanMetrics Atlas</title>
  <style>
    .bg { fill: #05294d; }
    .wave { fill: #2fc7b8; }
    .crest { fill: none; stroke: #e9dcb4; stroke-width: 3.5; stroke-linecap: round; }
    .ring { fill: none; stroke: #05294d; stroke-width: 3.5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #2fc7b8; }
    }
  </style>
  <path class="bg" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z" />
  <path class="wave" d="M6.9 40c6-7 13-7 19-1s14 7 21 0 8-4 10.2-2.5v10L32 61 6.9 46.5Z" />
  <path class="crest" d="M10 30.5c5-6 11-6 16.5-1s13 6 19.5-.5 7-3.5 9-2.5" />
  <path class="ring" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z" />
</svg>
