<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Marine Sensitivity Atlas">
  <!-- R5 (docs/usability.md §7): the wave-in-hexagon mark, replacing the placeholder plain hexagon.
       Same path data as src/lib/brand/WaveHexMark.svelte / public/brand/mark-wavehex.svg -- traced
       from the wave motif server/branding/make_branding.py draws for every other product mark,
       reshaped to a pointy-top hexagon clip per the R5 decision. Literal colours (never CSS custom
       properties: a favicon is not part of the app's `data-theme` cascade), matching the R5
       candidate docs/design/candidates/mark-wave-hex.svg -- navy #001a57, gold #e8c24a, white. The
       ring alone answers `prefers-color-scheme` (the OS/browser chrome's own signal, not the app's
       theme toggle) so the navy hexagon separates from a dark tab strip. -->
  <title>Marine Sensitivity Atlas</title>
  <style>
    .bg { fill: #001a57; }
    .wave { fill: #e8c24a; }
    .crest { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; }
    .ring { fill: none; stroke: #001a57; stroke-width: 3.5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #e8c24a; }
    }
  </style>
  <path class="bg" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z" />
  <path class="wave" d="M6.9 40c6-7 13-7 19-1s14 7 21 0 8-4 10.2-2.5v10L32 61 6.9 46.5Z" />
  <path class="crest" d="M10 30.5c5-6 11-6 16.5-1s13 6 19.5-.5 7-3.5 9-2.5" />
  <path class="ring" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29Z" />
</svg>
